name: Windows validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust matching the validated local toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt
          rustup default 1.92.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Insight-Windows-x64
          path: target/release/pc-insight-desktop.exe
