[package]
name = "pc-insight-desktop"
version = "0.4.0"
edition = "2021"
default-run = "pc-insight-desktop"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "pc_insight_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
pc-domain.workspace = true
pc-database.workspace = true
pc-collector.workspace = true
pc-session.workspace = true
pc-analytics.workspace = true
pc-activitywatch.workspace = true
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
