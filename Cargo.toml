[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/domain", "crates/context", "crates/classifier", "crates/session", "crates/analytics", "crates/database", "crates/collector", "crates/activitywatch"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
pc-domain = { path = "crates/domain" }
pc-context = { path = "crates/context" }
pc-classifier = { path = "crates/classifier" }
pc-session = { path = "crates/session" }
pc-analytics = { path = "crates/analytics" }
pc-database = { path = "crates/database" }
pc-collector = { path = "crates/collector" }
pc-activitywatch = { path = "crates/activitywatch" }
